push: Build APK

on: push

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          mkdir -p out

      - name: Build JRE
        run: ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build APK
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZalithLauncher-8key-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*
# trigger build
